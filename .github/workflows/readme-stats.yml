name: Update README stats

on:
  schedule:
    - cron: "0 3 * * *" # 00:00 in Brasília (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/readme-stats.yml]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # fail_on_error keeps the last good SVG instead of committing an error card;
      # continue-on-error lets the other card still update if one fails.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide=stars
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats" || exit 0
          git push
